name: Module 3 - Contexts and Conditions
on: workflow_dispatch
permissions:
  contents: read
env:
  COURSE: DevOps
jobs:
  contexts:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect selected contexts
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          OS: ${{ runner.os }}
          STUDENT: ${{ vars.STUDENT_NAME }}
        run: printf '%s\n' "github.actor=$ACTOR" "github.event_name=$EVENT" "runner.os=$OS" "vars.STUDENT_NAME=$STUDENT" "env.COURSE=$COURSE"
      - name: Contains condition
        if: contains(github.repository, 'github-actions-lab')
        run: echo 'contains() matched the activity repository'
      - name: Success condition
        if: success()
        run: echo 'success() is true'
      - name: Failure handler
        if: failure()
        run: echo 'failure() is true; inspect the failing step'
      - name: Always condition
        if: always()
        run: echo 'always() executes regardless of previous status'
  dependent-job:
    needs: contexts
    runs-on: ubuntu-latest
    steps:
      - run: echo 'needs establishes a dependency between jobs'
